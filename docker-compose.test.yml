# Throwaway databases for tests/integration. Ports are offset so they never clash with local databases.
#   python tests/ssh_fixture/make_keys.py      (once: creates the throwaway SSH keys the sshd service uses)
#   docker compose -f docker-compose.test.yml up -d --wait
#   .venv/bin/python -m pytest tests/integration
name: dbviz-test
services:
  mysql:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: testpw, MYSQL_DATABASE: dbviz }
    ports: ["13306:3306"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptestpw"], interval: 3s, timeout: 3s, retries: 40 }
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: testpw, POSTGRES_DB: dbviz }
    ports: ["15432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d dbviz"], interval: 3s, timeout: 3s, retries: 40 }
  mongodb:
    image: mongo:7
    ports: ["27018:27017"]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"], interval: 3s, timeout: 5s, retries: 40 }
  redis:
    image: redis:7-alpine
    ports: ["16379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 3s, retries: 40 }
  cassandra:
    image: cassandra:4.1
    environment: { MAX_HEAP_SIZE: 512M, HEAP_NEWSIZE: 128M }
    ports: ["19042:9042"]
    healthcheck: { test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"], interval: 10s, timeout: 10s, retries: 30 }
  # An SSH server on the same network as the databases above. The databases publish ports to the host, but the
  # SSH tests reach them by their internal names (mysql, postgres, ...), which only resolve inside this network,
  # so a passing test proves the traffic really went through the tunnel.
  sshd:
    image: linuxserver/openssh-server:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      USER_NAME: tunnel
      USER_PASSWORD: tunnelpw
      PASSWORD_ACCESS: "true"
      PUBLIC_KEY_FILE: /keys/authorized_keys
      LOG_STDOUT: "true"
    volumes:
      - ./tests/ssh_fixture/authorized_keys:/keys/authorized_keys:ro
      - ./tests/ssh_fixture/enable-forwarding.sh:/custom-cont-init.d/enable-forwarding.sh:ro
    ports: ["12222:2222"]
    healthcheck: { test: ["CMD-SHELL", "nc -z 127.0.0.1 2222"], interval: 3s, timeout: 3s, retries: 40 }
  # SQL Server: the regular image is amd64-only and crashes under emulation on Apple Silicon, so the tests use Azure SQL
  # Edge, which has a native arm64 build and speaks the same T-SQL protocol. (Edge is end-of-life; use mssql/server on x86.)
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Testpw123!" }
    ports: ["11433:1433"]
    cap_add: [SYS_PTRACE]
    healthcheck: { test: ["CMD-SHELL", "grep -q 'ready for client connections' /var/opt/mssql/log/errorlog"], interval: 5s, timeout: 5s, retries: 40 }
  # Oracle Database Free (multi-arch community image). python-oracledb needs no Instant Client.
  oracle:
    image: gvenzl/oracle-free:slim-faststart
    environment: { ORACLE_PASSWORD: testpw, APP_USER: dbviz, APP_USER_PASSWORD: testpw }
    ports: ["11521:1521"]
    healthcheck: { test: ["CMD", "healthcheck.sh"], interval: 10s, timeout: 10s, retries: 40, start_period: 30s }
