name: Linux desktop check

# Runs a published Linux release in a full desktop session (XFCE) on a native x86-64 Ubuntu 24.04 machine, drives the app's own
# window, and keeps screenshots of the whole desktop as an artifact. Run it by hand (Actions > Linux desktop check > Run workflow)
# with a release tag, or it runs when this check's own files change on its branch.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: A release tag such as v0.2.2, or run:<id> for the Linux build of a CI run
        required: true
        default: v0.2.2
  push:
    branches: [check/linux-desktop]

permissions:
  contents: read
  actions: read          # to download the build of a CI run

jobs:
  desktop:
    name: Linux desktop check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Run the released app in a desktop
        env:
          GH_TOKEN: ${{ github.token }}
        # by hand: the tag or run you typed; on a push to this branch: the line in packaging/desktop-check-source.txt
        run: |
          SOURCE="${{ inputs.tag }}"
          if [ -z "$SOURCE" ]; then SOURCE=$(cat packaging/desktop-check-source.txt); fi
          bash packaging/linux-desktop-check.sh "$SOURCE"
      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-check
          path: |
            desktop-check/*.png
            desktop-check/*.log
          if-no-files-found: warn
