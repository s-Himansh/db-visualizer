name: Release

# Push a tag like v0.1.0 to build the apps and publish them as a GitHub Release (the download page links to it).
# Pull requests are not built here: CI builds the apps (the same Build the apps workflow) when a pull request could change
# what gets packaged, so a pull request shows one run, not two.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    name: Tests before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests --ignore=tests/e2e --ignore=tests/integration

  # Starts at once, alongside the tests; only publishing waits for both.
  build:
    uses: ./.github/workflows/build-apps.yml

  publish:
    name: Publish the release
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum *.zip *.dmg | tee SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" *.zip *.dmg SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
            --title "Cairn $GITHUB_REF_NAME" --generate-notes \
            --notes "These builds are not signed yet, so the first launch needs one confirmation. macOS 15 and newer: click Done, then System Settings > Privacy & Security > Open Anyway. Older macOS: right-click the app and choose Open. Windows: More info, then Run anyway. Details: https://s-himansh.github.io/db-visualizer/"
