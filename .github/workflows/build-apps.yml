name: Build the apps

# Builds Cairn for macOS (Apple Silicon and Intel) and Windows and uploads each as an artifact. It does not publish anything.
# Two things call it: the Release workflow (on a version tag, which then publishes the files) and CI (on a pull request that
# could change what gets packaged, so a packaging problem is caught in review). Run it by hand for a dry run.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}                        # shown as  Build / <platform>  (the caller names the group)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30                              # a hang must not hold a run for hours (the default limit is six)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, label: macOS (Apple Silicon), file: Cairn-macOS-AppleSilicon, ext: dmg }
          - { os: macos-15-intel, label: macOS (Intel), file: Cairn-macOS-Intel, ext: dmg }
          - { os: windows-latest, label: Windows, file: Cairn-Windows, ext: zip }
          # Built on the oldest Ubuntu the runners offer: a program built against an older glibc runs on newer systems, not the reverse.
          - { os: ubuntu-22.04, label: Linux, file: Cairn-Linux-x86_64, ext: tar.gz }
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the app (macOS)
        if: runner.os == 'macOS'
        run: SKIP_TESTS=1 ./build.sh

      - name: Build the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          python -m PyInstaller --noconfirm --clean --windowed --name "Cairn" --icon packaging/cairn.ico `
            --add-data "static;static" --collect-submodules db_connectors `
            --collect-all cassandra --collect-all pymssql --collect-submodules keyring `
            --collect-submodules anthropic --copy-metadata keyring db.py

      # PyInstaller leaves the graphics-stack libraries out on purpose (they should match the desktop's own drivers), but Qt loads
      # them whether or not it draws with them, and a desktop installed without its optional packages does not have them: a full
      # XFCE session found the app exiting at startup for want of libEGL. The app draws in software by default, so these are only
      # the small, vendor-neutral dispatch layer (libglvnd: GL, GLX, GLdispatch, EGL), the Wayland client and server libraries,
      # and the two Mesa-side libraries the web engine loads (libdrm, libxcb-dri3). They are added by hand. Hardware drawing
      # (DBV_GPU=1) uses the system's own drivers through them; if that misbehaves, delete these files from the app folder.
      # packaging/host-libraries.py then checks what is still asked of the host.
      # Linux has no built-in web view to lean on, so the app carries Qt's (PySide6, LGPL). The packages below are what Qt's web
      # engine needs on the build machine; PyInstaller copies the libraries it finds into the bundle, so the people who download
      # it install nothing. The web view is loaded by name at run time, which PyInstaller's import scan cannot see, so it is listed.
      - name: Build the app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils libnss3 libnspr4 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libegl1 libgl1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 \
            libglib2.0-0 libxshmfence1 libxfixes3 libxext6 libxi6 libxrender1 libx11-xcb1 libgssapi-krb5-2 \
            libwayland-client0 libwayland-server0 libwayland-cursor0 libwayland-egl1 libpulse0
          python -m pip install -r requirements-dev.txt -r requirements-linux.txt
          python -m PyInstaller --noconfirm --clean --name Cairn --add-data "static:static" --collect-submodules db_connectors \
            --collect-all cassandra --collect-all pymssql --collect-submodules keyring --collect-submodules anthropic \
            --copy-metadata keyring \
            --add-binary /usr/lib/x86_64-linux-gnu/libwayland-server.so.0:. \
            --add-binary /usr/lib/x86_64-linux-gnu/libwayland-egl.so.1:. \
            --add-binary /usr/lib/x86_64-linux-gnu/libwayland-cursor.so.0:. \
            --add-binary /usr/lib/x86_64-linux-gnu/libwayland-client.so.0:. \
            --add-binary /usr/lib/x86_64-linux-gnu/libGL.so.1:. \
            --add-binary /usr/lib/x86_64-linux-gnu/libGLX.so.0:. \
            --add-binary /usr/lib/x86_64-linux-gnu/libGLdispatch.so.0:. \
            --add-binary /usr/lib/x86_64-linux-gnu/libEGL.so.1:. \
            --add-binary /usr/lib/x86_64-linux-gnu/libdrm.so.2:. \
            --add-binary /usr/lib/x86_64-linux-gnu/libxcb-dri3.so.0:. \
            --hidden-import webview.platforms.qt --hidden-import qtpy --hidden-import PySide6.QtWebEngineWidgets \
            --hidden-import PySide6.QtWebEngineCore --hidden-import PySide6.QtWebChannel --hidden-import PySide6.QtNetwork db.py

      # A packaged app can be missing things the source tree has. Run the built program itself and have it check.
      - name: Check the built app starts (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/Cairn.app/Contents/MacOS/Cairn" --self-check | tee check.txt
          grep -q "self-check ok" check.txt
      - name: Check the built app starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Cairn\Cairn.exe" -ArgumentList "--self-check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-check exited with $($p.ExitCode)" }

      # The disk image people open: Cairn and an Applications shortcut to drag it onto. dmgbuild writes the window layout
      # itself, so it needs no Finder (a build machine has no screen to script).
      - name: Make the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install dmgbuild
          dmgbuild -s packaging/dmg_settings.py -D app="dist/Cairn.app" "Cairn" "${{ matrix.file }}.dmg"
      - name: Zip the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist\Cairn" -DestinationPath "${{ matrix.file }}.zip"

      - name: List what the app asks of the desktop, and fail if it is more than expected (Linux)
        if: runner.os == 'Linux'
        run: python3 packaging/host-libraries.py dist/Cairn
      - name: Pack the app (Linux)
        if: runner.os == 'Linux'
        run: tar czf "${{ matrix.file }}.tar.gz" -C dist Cairn           # a tarball keeps the "may run" permission a zip would drop
      # The faithful test: a fresh Ubuntu 24.04 with only what every Linux desktop has (a virtual screen and Mesa's graphics
      # libraries), so the libraries bundled in the app are what is being tested. packaging/linux-check.sh lists any library the
      # bundle needs that the system lacks, runs the built-in check, then opens the real window and sees whether it stays open.
      - name: Check it starts on a bare Ubuntu 24.04 (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: docker run --rm -v "$PWD:/in:ro" ubuntu:24.04 bash /in/packaging/linux-check.sh "${{ matrix.file }}.tar.gz"

      - name: Keep the file for the next job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}.${{ matrix.ext }}
          if-no-files-found: error
