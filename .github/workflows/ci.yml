name: CI

# Pull requests run on the PR; pushes only on main. Without this filter every commit to a PR ran the whole suite twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI is a short list of groups. Each group is a workflow of its own, so GitHub shows it as one collapsible box with its runners
# inside:
#
#   Checks           (does the pull request touch the packaging?)
#   Build            macOS (Apple Silicon), macOS (Intel), Windows, Linux   only when packaging changed   build-apps.yml
#   Linux tests      Unit, Browser (1 of 3), (2 of 3), (3 of 3)                                         tests-os.yml
#   Windows tests    Unit, Browser (1 of 3), (2 of 3), (3 of 3)                                         tests-os.yml
#   macOS tests      Unit, Browser (1 of 3), (2 of 3), (3 of 3)   Apple Silicon                         tests-os.yml
#   Database tests   SQL, SQL in the browser, MongoDB / Redis / Cassandra                               tests-databases.yml
#
# The wait on a pull request is the slowest single runner, so the long suites are cut into chunks on separate machines.
jobs:
  changes:
    name: Checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packaging: ${{ steps.diff.outputs.packaging }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Anything that gets packaged into the apps: the build scripts, the code and drivers that are bundled, the requirements.
      - name: Does this pull request touch the packaging?
        id: diff
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" \
             | grep -qE '^(\.github/workflows/(ci|build-apps|release)\.yml|build\.sh|packaging/|db\.py|db_connectors/|requirements[^/]*\.txt)'; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          fi

  # The apps for every platform, built the way a release builds them, so a change that breaks packaging is caught in review.
  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    uses: ./.github/workflows/build-apps.yml

  linux-tests:
    name: Linux tests
    uses: ./.github/workflows/tests-os.yml
    with:
      runner: ubuntu-latest

  windows-tests:
    name: Windows tests
    uses: ./.github/workflows/tests-os.yml
    with:
      runner: windows-latest

  # Apple Silicon only: the Intel Mac is the same code on a slower, scarcer runner, so it keeps its build and self-check (Build group).
  macos-tests:
    name: macOS tests
    uses: ./.github/workflows/tests-os.yml
    with:
      runner: macos-latest

  database-tests:
    name: Database tests
    uses: ./.github/workflows/tests-databases.yml
